# =========================================================
# MuJoCo model settings for the robot_description URDF
# - what a URDF has no place to state, kept beside the Gazebo controllers
# - armature and the servo gains scale with the robot, so a different
#   URDF needs these retuned even though the meshes carry over
# =========================================================
mujoco_model:
  # Gearbox inertia reflected to the joint [kg m^2]
  # - the wrist links are only ~2e-4, which diverges at the 2 ms timestep
  armature: 0.1

  # Position servo, one per movable joint
  kp: 5000.0  # [N m / rad]
  kv: 100.0   # [N m s / rad]

  # Cancel gravity, as a real industrial controller does
  # - without it the shoulder and elbow sag by about 0.007 rad
  gravity_compensation: true
