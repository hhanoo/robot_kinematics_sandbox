# =============================================================================
# 태그(v*) push 시 공용 재사용 워크플로우를 호출해 릴리즈를 생성하는 워크플로우
# =============================================================================
name: Release

# =============================================================================
# 워크플로우 실행 조건
# - push 이벤트 중 "v"로 시작하는 태그가 push될 때만 실행
# =============================================================================
on:
  push:
    tags:
      - "v*"

# =============================================================================
# 중복 실행 방지
# - 동일한 태그에 대해 릴리즈 워크플로우가 동시에 여러 번 실행되는 상황 방지
# =============================================================================
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# 권한 설정
# - contents: write
#   → 릴리즈 생성/수정에 필요한 권한
# =============================================================================
permissions:
  contents: write

# =============================================================================
# 릴리즈 Job
# - 공용 저장소의 reusable workflow를 호출해 릴리즈 로직을 재사용
# =============================================================================
jobs:
  release:
    uses: hhanoo/github-common/.github/workflows/release-reusable.yml@main
    with:
      runner: ubuntu-latest # runner 미지정시 기본값 ubuntu-latest 사용
